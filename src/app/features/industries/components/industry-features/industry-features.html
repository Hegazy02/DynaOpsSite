<div class="container-page">
  <div class="mx-auto flex w-full max-w-300 flex-col items-center gap-12 xl:gap-16">
    <div class="flex max-w-160 flex-col items-center gap-4 text-center xl:max-w-none">
      <p class="flex items-center gap-2 text-label-md text-fg-brand">
        <img [src]="content().eyebrow.icon" alt="" width="24" height="24" class="size-6" />
        {{ content().eyebrow.label }}
      </p>
      <!-- Figma, English: title wraps naturally (500px box on tablet unless the page sets one, balanced from xl); description wraps naturally in each page's box. -->
      <!-- Figma, Arabic: one-line title; description wraps naturally at 556px, one line from xl unless the page sets a box. -->
      <h2
        class="text-h3 md:text-h2 md:rtl:max-w-none xl:text-display-md"
        [class]="titleWidthClass()"
      >
        {{ content().title }}
      </h2>
      <p
        class="max-w-192 text-body-md text-fg-secondary rtl:max-w-139 md:rtl:max-w-139"
        [class]="descriptionWidthClass()"
      >
        {{ content().description }}
      </p>
    </div>

    <div class="grid w-full max-w-160 gap-6 xl:max-w-none xl:grid-cols-3">
      @for (item of content().items; track item.title) {
        <app-feature-card [content]="item" />
      }
    </div>
  </div>
</div>
