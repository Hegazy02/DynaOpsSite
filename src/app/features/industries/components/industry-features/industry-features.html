<div class="container-page py-16">
  <div class="mx-auto flex w-full max-w-300 flex-col items-center gap-12 xl:gap-16">
    <div class="flex max-w-160 flex-col items-center gap-4 text-center xl:max-w-none">
      <p class="flex items-center gap-2 text-label-md text-fg-brand">
        <img [src]="content().eyebrow.icon" alt="" class="size-6" />
        {{ content().eyebrow.label }}
      </p>
      <!-- Figma, English: natural wrapping full width on phones and in 500px/430px boxes on tablet, balanced from xl. -->
      <!-- Figma, Arabic: one-line title; description wraps naturally at 556px, one line from xl. -->
      <h2
        class="text-h3 md:max-w-125 md:text-h2 md:rtl:max-w-none xl:max-w-205 xl:text-balance xl:text-display-md"
      >
        {{ content().title }}
      </h2>
      <p
        class="max-w-192 text-body-md text-fg-secondary rtl:max-w-139 md:rtl:max-w-139 xl:max-w-192 xl:text-balance xl:rtl:max-w-none"
        [class]="tabletDescriptionWidth()"
      >
        {{ content().description }}
      </p>
    </div>

    <div class="grid w-full max-w-160 gap-6 xl:max-w-none xl:grid-cols-3">
      @for (item of content().items; track item.title) {
        <app-industry-feature-card [content]="item" />
      }
    </div>
  </div>
</div>
