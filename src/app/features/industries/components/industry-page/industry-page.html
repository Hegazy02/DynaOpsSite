<app-industries-hero
  [title]="content().hero.title"
  [subtitle]="content().hero.subtitle"
  [emphasis]="content().hero.emphasis"
  [image]="content().hero.image"
  [tabletWidth]="content().hero.tabletWidth"
  [arabicTabletWidth]="content().hero.arabicTabletWidth"
  [englishTitleWidth]="content().hero.englishTitleWidth"
  [subtitleRole]="content().hero.subtitleRole ?? 'body'"
/>
<ng-content select="[industryAfterHero]" />

<app-industry-features [content]="content().features" />
<ng-content select="[industryAfterFeatures]" />

<app-industries-integration
  [title]="content().integration.title"
  [paragraphs]="content().integration.paragraphs"
  [allParagraphsOnTablet]="content().integration.allParagraphsOnTablet ?? false"
  [allParagraphsOnPhone]="content().integration.allParagraphsOnPhone ?? false"
/>
<ng-content select="[industryAfterIntegration]" />

<app-industries-visibility
  [title]="content().visibility.title"
  [paragraphs]="content().visibility.paragraphs"
  [lastParagraphDesktopOnly]="content().visibility.lastParagraphDesktopOnly ?? false"
  [image]="content().visibility.image"
/>
<ng-content />

<ng-template appFooterCta>
  <app-cta-container
    [image]="content().footerCta.image.src"
    [imageWidth]="content().footerCta.image.width"
    [imageHeight]="content().footerCta.image.height"
    [imageCoverOffset]="content().footerCta.image.coverOffset ?? 0"
    imageCover
    imageBehindGradient
  >
    <!-- 800px: one-line CTA titles up to Retail's, longer ones balance onto two lines as in Figma. -->
    <div class="flex max-w-200 flex-col gap-4" [class]="ctaTextClass()">
      <h2 class="text-balance text-h2 md:text-h1" [class]="ctaTitleClass()">
        {{ content().footerCta.title }}
      </h2>
      <p class="mx-auto max-w-165 text-balance text-body-md" [class]="ctaDescriptionClass()">
        {{ content().footerCta.description }}
      </p>
    </div>
    <a
      appButton
      variant="secondary"
      icon="/icons/shared/arrow-right-02.svg"
      iconHover="/icons/shared/arrow-right-02-brand.svg"
      directionalIcon
      [routerLink]="content().footerCta.button.href"
    >
      {{ content().footerCta.button.label }}
    </a>
  </app-cta-container>
</ng-template>
