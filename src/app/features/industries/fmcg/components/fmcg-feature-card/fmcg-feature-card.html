<!-- Figma hover variant: brand border, small shadow and the artwork growing 6% from its top, smart-animated 300ms ease-out. -->
<article
  class="card group h-full gap-6 p-2 transition duration-300 ease-out hover:border-line-brand hover:shadow-sm motion-reduce:transition-none"
>
  <div class="card-media">
    <img
      [src]="content().image"
      alt=""
      width="356"
      height="280"
      loading="lazy"
      class="origin-top max-w-none shrink-0 transition-transform duration-300 ease-out group-hover:scale-106 motion-reduce:transition-none"
    />
  </div>
  <div class="flex flex-col gap-2 p-4">
    <h3 class="text-h3">{{ content().title }}</h3>
    <p class="text-body-md text-fg-secondary">{{ content().description }}</p>
  </div>
</article>
