<div class="container-page">
  <div class="mx-auto flex w-full max-w-300 flex-col items-center gap-12 xl:gap-16">
    <!-- Figma, English: 640px box on tablet, 586px from xl. Arabic: one-line title from md, paragraphs in 556px on tablet, one line each from xl. -->
    <div
      class="flex max-w-160 flex-col items-center gap-4 text-center xl:max-w-146.5 xl:rtl:max-w-none"
    >
      <h2
        class="text-h2-sm max-md:rtl:text-h2 md:text-h2 md:rtl:whitespace-nowrap xl:text-display-md"
      >
        {{ content().title }}
      </h2>
      @for (paragraph of content().paragraphs; track $index) {
        <p class="text-body-md text-fg-secondary md:max-xl:rtl:max-w-139">{{ paragraph }}</p>
      }
    </div>

    <div class="grid w-full max-w-160 gap-6 xl:max-w-none xl:grid-cols-3">
      @for (item of content().items; track item.title) {
        <app-feature-card [content]="item" />
      }

      <!-- Figma hover variant: brand border and the watermark growing from 288 to 328px off its bottom corner, 300ms ease-out. -->
      <a
        class="card group min-h-109.5 p-2 transition duration-300 ease-out hover:border-line-brand motion-reduce:transition-none"
        [routerLink]="content().brandCard.cta.href"
      >
        <div
          class="relative flex flex-1 flex-col items-start justify-end gap-5 overflow-hidden rounded-md bg-linear-to-b/srgb from-brand-500 to-brand-500/50 p-5"
        >
          <!-- Figma mirrors the watermark in Arabic; the wrapper flips it so the hover scale keeps its own transform. -->
          <div class="absolute start-5 top-15 rtl:-scale-x-100">
            <img
              [src]="content().brandCard.mark"
              alt=""
              width="288"
              height="288"
              loading="lazy"
              class="size-72 max-w-none origin-bottom-left transition-transform duration-300 ease-out group-hover:scale-114 motion-reduce:transition-none"
            />
          </div>
          <h3 class="relative text-h3 whitespace-pre-line text-fg-inverse">
            {{ content().brandCard.title }}
          </h3>
          <!-- The whole card is the link, so the button is drawn, not nested. -->
          <span class="btn btn-md btn-secondary relative">
            {{ content().brandCard.cta.label }}
            <img
              src="/icons/shared/arrow-right-02.svg"
              alt=""
              width="18"
              height="18"
              class="rtl:-scale-x-100"
            />
          </span>
        </div>
      </a>
    </div>
  </div>
</div>
