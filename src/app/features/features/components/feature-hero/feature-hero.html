<div class="container-page py-8 xl:py-16">
  <div
    class="mx-auto flex w-full max-w-300 flex-col items-center gap-8 text-center xl:flex-row xl:justify-between xl:gap-6 xl:text-start"
  >
    <div class="contents xl:flex xl:max-w-144.25 xl:flex-col xl:items-start xl:gap-8">
      <div class="contents xl:flex xl:flex-col xl:gap-4">
        <!-- Figma sets the eyebrow in Body/Medium at semibold weight; no type role carries that weight. -->
        <p class="order-1 text-body-md font-semibold text-fg-brand xl:order-none">
          {{ eyebrow() }}
        </p>
        <!-- Figma boxes: 564px English and 554 / 486px Arabic on tablet (or 629px where the page asks); 458 / 557px Arabic on desktop. -->
        <div class="order-3 flex w-full flex-col gap-4 md:max-xl:ltr:max-w-141 xl:order-none">
          <h1
            class="text-h2 md:text-h1 md:max-xl:rtl:mx-auto xl:text-display-md xl:rtl:max-w-114.5"
            [class]="
              wideArabicTabletCopy() ? 'md:max-xl:rtl:max-w-157.25' : 'md:max-xl:rtl:max-w-138.5'
            "
          >
            {{ title() }}
          </h1>
          <p
            class="text-body-md text-fg-secondary md:max-xl:rtl:mx-auto xl:rtl:max-w-139.25"
            [class]="
              wideArabicTabletCopy() ? 'md:max-xl:rtl:max-w-157.25' : 'md:max-xl:rtl:max-w-121.5'
            "
          >
            {{ subtitle() }}
            @if (emphasis(); as emphasis) {
              <strong class="font-semibold">{{ emphasis }}</strong>
            }
          </p>
          @if (note(); as note) {
            <p
              class="text-body-md text-fg-secondary md:max-xl:rtl:mx-auto md:max-xl:rtl:max-w-121.5 xl:rtl:max-w-139.25"
            >
              {{ note }}
            </p>
          }
        </div>
      </div>
      <a
        appButton
        class="order-4 w-full md:w-auto md:min-w-50 xl:order-none xl:min-w-0"
        icon="/icons/shared/arrow-right-02-white.svg"
        directionalIcon
        [routerLink]="cta().href"
      >
        {{ cta().label }}
      </a>
    </div>

    <!-- Each language has its own mock, so it is not mirrored. -->
    <img
      [ngSrc]="image().src"
      [alt]="image().alt"
      [width]="image().width"
      [height]="image().height"
      priority
      class="order-2 w-full max-w-102 shrink-0 xl:order-none"
    />
  </div>
</div>
